services:
  style-transfer:
    build:
      context: .
      dockerfile: Dockerfile
    image: 3dgs-style-transfer:latest
    volumes:
      - ./input:/workspace/input
      - ./output:/workspace/output
      - ./cycle-diffusion-for-anime-face/ckpts:/workspace/cycle-diffusion-for-anime-face/ckpts
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
